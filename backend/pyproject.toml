[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccreview-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "pydantic-settings>=2.3",
  "anthropic>=0.34",
  "litellm>=1.50",
  "openai>=1.30",
  "google-generativeai>=0.7",
  "celery[redis]>=5.4",
  "minio>=7.2",
  "qdrant-client>=1.11",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "python-pptx>=0.6",
  "paddleocr>=2.7",
  "sentence-transformers>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
